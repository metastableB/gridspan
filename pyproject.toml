[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridspan"
dynamic = ["version"]
description = "Expand a nested dict of parameter sets into a list of flat run configs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "metastableB" }]
keywords = ["parameter sweep", "grid search", "hyperparameters", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/metastableB/gridspan"
Issues = "https://github.com/metastableB/gridspan/issues"

[project.optional-dependencies]
mlflow = ["mlflow>=2.9"]
dev = ["pytest>=8", "ruff>=0.12", "mlflow>=2.9"]

[tool.setuptools]
packages = ["gridspan", "gridspan.extras"]

[tool.setuptools.dynamic]
version = { attr = "gridspan.__version__" }

[tool.setuptools.package-data]
gridspan = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
